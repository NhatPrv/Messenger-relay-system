version: '3.8'

services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-change_this_secure_password_123}
      - JWT_SECRET=${JWT_SECRET:-super_secret_session_key_change_me}
      - FB_MOCK_MODE=${FB_MOCK_MODE:-false}
      - FB_APPSTATE_PATH=/usr/src/app/appstate.json
    volumes:
      - ./server/appstate.json:/usr/src/app/appstate.json:ro
      - ./server/logs:/usr/src/app/logs
    restart: unless-stopped

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - server
    restart: unless-stopped
